name: casp-radar

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file: .env
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      - collector

  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      - collector

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
