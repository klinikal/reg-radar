- id: hu-mnb
  name: MNB
  full_name: Magyar Nemzeti Bank
  jurisdiction: hu
  jurisdiction_type: member_state
  website: https://www.mnb.hu/en/
  mica_competent_authority: true
  enabled: true
  cloudflare_protected: false
  warnings_url: https://www.mnb.hu/en/supervision/market-supervision/vi-1-investor-warnings
  notes: "Non-standard RSS path pattern (/enrss/{id}). Standard paths all 404."
  # scripts/reprocess_bodies.py --refetch: CSS selector for an item's full
  # body on its own source_url page (issue #17). Every RSS item here is
  # is_partial, so the collector never fetches the article page itself -
  # this is what --refetch uses to backfill it. .side-content (a nav/
  # related-links column) is a sibling of .main-content, not a descendant,
  # so selecting .main-content alone already excludes it - no detail_exclude
  # needed here (verified against a live sampled article). Confirmed against
  # 8 sampled live articles; 2/10 sampled source_urls 404 (MNB has removed
  # the page).
  detail_selector: ".main-content.lyt-offset.lyt-fluid"
  sources:
  - type: rss
    url: https://www.mnb.hu/enrss/14
    label: supervision_news
    preferred_language: en
    labels: {}
  - type: rss
    url: https://www.mnb.hu/enrss/23
    label: market_supervision
    preferred_language: en
    labels: {}
  - type: rss
    url: https://www.mnb.hu/enrss/16
    label: press_room
    preferred_language: en
    labels:
      document_type: press_release
  - type: rss
    url: https://www.mnb.hu/enrss/6
    label: latest_releases
    # DISABLED. /enrss/6 "Latest releases" serves a single item from
    # 2020-06-15 and has produced exactly 1 item in this install's history.
    # MNB's English RSS estate is largely abandoned (verified 2026-09-11):
    # /enrss/1 and /enrss/2 stopped in 2015 - one of them is literally
    # "teszt cimke", a test tag - /enrss/7 in 2016, and /enrss/5 and /enrss/8
    # carry thousands of entries whose dates are all epoch 0. Nothing here is
    # a usable replacement. MNB stays covered by its three working feeds:
    # supervision_news (/14), market_supervision (/23) and press_room (/16).
    enabled: false
    preferred_language: en
    labels: {}

