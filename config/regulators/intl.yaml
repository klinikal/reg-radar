# International standard-setting bodies (jurisdiction id `intl`). Standalone
# root in config/jurisdictions.yaml with NO parent/child edges: FATF
# standards bind nobody directly, so profiles opt in explicitly.
- id: intl-fatf
  name: FATF
  full_name: Financial Action Task Force
  jurisdiction: intl
  jurisdiction_type: international
  website: https://www.fatf-gafi.org
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: true           # 403 with `cf-mitigated: challenge` - REQUIRES FlareSolverr
  notes: "FATF is Cloudflare-protected: plain fetches return 403 with a cf-mitigated: challenge header, so FLARESOLVERR_URL must be set. black_and_grey_lists is a page_watch because the watched fragment carries the actual country lists - the diff IS the substance. watch_selector must stay `body > div.container.responsivegrid`: narrower selectors FAIL because page_watch uses select_one and div.aem-Grid--10 first-matches the intro blurb. The fragment includes static nav, so a FATF menu redesign produces one false 'change' - acceptable at ~3 real events a year. Do NOT use /en/publications.html: it is a category hub, not a feed; FATF's real publication listing is AEM faceted search, JS-only, and even its JS assets 403 to non-browser clients. `latest` has no usable date - .cmp-teaser__date is absent on the home carousel (it appears only on category hubs), so items land with date_inferred: true; the last few teasers are evergreen tiles (Recommendations, Methodology, private-sector page), one-off noise on first run, static thereafter."

  sources:

  - type: page_watch
    url: "https://www.fatf-gafi.org/en/countries/black-and-grey-lists.html"
    label: black_and_grey_lists
    preferred_language: en
    tags: [page_watch]
    watch_selector: "body > div.container.responsivegrid"
    # NO staleness: block here, deliberately, and none is possible today.
    # This source shipped with warn 200 / error 550 - sized against FATF's
    # three-plenary-a-year cadence (Feb/Jun/Oct), where ~130 days is a normal
    # gap - and it asserted nothing whatsoever. A page_watch item carries a
    # fetch-time date, not the source's, so the age the freshness check reads
    # is always zero and no threshold can ever be crossed. It read as
    # considered configuration while being dead, which is worse than an
    # obvious gap; registry validation now rejects the shape outright.
    #
    # The assertion this source actually wants is "no change detected in N
    # days", which needs collection history. The nightly check has no
    # database by design - it runs in CI - so that belongs in a DB-backed
    # check, not here. Until then FATF's freshness is unasserted, and that is
    # said out loud rather than implied by a setting that does nothing.

  - type: scrape
    url: "https://www.fatf-gafi.org/en/home.html"
    label: latest
    preferred_language: en
    labels: {}
    tags: [news]
    scrape:
      item_selector: ".cmp-teaser"
      title_selector: ".cmp-teaser__title"
      link_selector: "a"
      date_selector: null            # no date element on the home carousel
      date_attribute: null
      date_fuzzy: false
      content_selector: null
      extract_pdf_text: false
