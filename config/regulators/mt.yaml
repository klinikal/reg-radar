- id: mt-fiau
  name: FIAU
  full_name: Financial Intelligence Analysis Unit (Malta)
  jurisdiction: mt
  jurisdiction_type: member_state
  website: https://fiaumalta.org
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: false
  warnings_url:
  notes: "Malta's AML/CFT supervisor - CASPs are AML-obliged entities, so FIAU guidance is directly relevant alongside MFSA's MiCA-competent-authority role. No RSS feed exists; scraped directly. Page structure is unusual: all items on page 1 share one wrapping <article class=\"grid\"> rather than one <article> per item - item_selector targets the div.col-span-1 children. Each item has two <a> tags to the same URL (title + \"Read More\") - a:not(.flex) reliably picks the title link, confirmed live against all 6 current items 2026-07-03."
  sources:
  - type: scrape
    url: "https://fiaumalta.org/news/"
    label: all_news
    preferred_language: en
    labels: {}
    scrape:
      item_selector: "article.grid > div.col-span-1"
      title_selector: "a:not(.flex)"
      link_selector: "a:not(.flex)"
      date_selector: "span.text-blue-light"
      date_attribute:
      content_selector:

