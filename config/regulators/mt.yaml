- id: mt-mfsa
  name: MFSA
  full_name: Malta Financial Services Authority
  jurisdiction: mt
  jurisdiction_type: member_state
  website: https://www.mfsa.mt
  mica_competent_authority: true
  enabled: true
  cloudflare_protected: true
  warnings_url: https://www.mfsa.mt/news/warnings/MFSA-Warnings/
  notes: "Site pages are Cloudflare-protected (confirmed 2026-07-02: blocks plain HTTP regardless of User-Agent, requires FlareSolverr for every request) - the feed endpoint (all_news, below) is the one exception and stays on plain RSS. Malta is the home jurisdiction for this operator - see the operator context (skills/reg-radar-operator/refs/context.md) for why MFSA coverage matters more here than for other member states. Publication categories below cover the full site taxonomy (~65 categories, confirmed via manual crawl of the /publications/ nav - not from MFSA's own category sitemap, which points to broken/mismatched /events/ URLs and can't be trusted). Only categories relevant to a bitcoin-only CASP are enabled by default; the rest are enabled: false so a full-taxonomy backfill (scripts/backfill_mfsa_publications.py) can target them later without needing to redefine every URL/selector from scratch. All scrape sources share one identical selector set (Salient WordPress theme, .single-publication blocks) confirmed against notices-and-decisions, dear-ceo-letters, and crypto-assets-circulars directly. Filter by title prefix 'MFSA Warning' on all_news to isolate warnings from that feed specifically."
  sources:
  - type: rss
    url: https://www.mfsa.mt/feed/
    label: all_news
    preferred_language: en
    labels: {}
  - type: scrape
    url: "https://www.mfsa.mt/publications/circulars/"
    label: circulars
    preferred_language: en
    labels: {}
    enabled: false
    scrape:
      item_selector: ".posts-container .single-publication"
      title_selector: ".publication-title a"
      link_selector: ".publication-title a"
      date_selector: ".date-published"
      date_attribute:
      content_selector:
  - type: scrape
    url: "https://www.mfsa.mt/publications/circulars/anti-money-laundering/"
    label: circulars_anti_money_laundering
    preferred_language: en
    labels: {}
    scrape:
