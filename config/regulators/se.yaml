- id: se-fi
  name: Finansinspektionen
  full_name: Finansinspektionen
  jurisdiction: se
  jurisdiction_type: member_state
  website: https://www.fi.se/en/
  mica_competent_authority: true
  enabled: true
  cloudflare_protected: false
  warnings_url: https://www.fi.se/en/our-registers/investor-alerts/
  notes: "Append /rss to any FI listing page URL to get a feed."
  # scripts/reprocess_bodies.py --refetch / collector detail-fetch (#17):
  # verified against 2 sampled live articles (1811 and 3206 chars recovered).
  detail_selector: ".content.with-sub-nav .page"
  detail_exclude: [".share-links"]
  sources:
  - type: rss
    url: https://www.fi.se/en/published/all-published-material/rss
    label: all_material
    preferred_language: en
    labels: {}
  - type: browser
    url: https://www.fi.se/en/our-registers/investor-alerts/
    label: investor_warnings
    preferred_language: en
    # Rendered page's warning items are `<li class="extended-click-area">`
    # with an `<h3>` title, a link inside `<p class="introduction">`, and
    # the publish date as a bare text node sitting directly between the two
    # (`<h3>...</h3>2026-08-17<p>...`) - confirmed 2026-09-27 on the live
    # rendered DOM, not just the static HTML (an FFFS-register-style JS
    # widget, but this one does render into plain HTML once Playwright runs
    # it). No wrapping element exists around that date text for a CSS
    # date_selector to target (bs4's :scope/self-selection was tried and
    # does not select the item element itself), so date_selector is left
    # unset here - items get the collector's own fetch-time inferred date
    # rather than the source's real publish date. Flagged, not fudged.
    labels:
      document_type: warning
    browser:
      wait_selector: "ul.searchresults-warnings-list li"
      item_selector: "ul.searchresults-warnings-list li"
      title_selector: "h3.headline-warnings"
      link_selector: "p.introduction a"
      date_selector:
      date_attribute:
  - type: rss
    url: https://www.fi.se/sv/publicerat/remissvar/rss
    label: consultation_responses
    # Swedish-only by design, not a duplicate-language risk: remissvar
    # (FI's own responses to other authorities'/ministries' consultations)
    # have no English equivalent at all - the English "consultation
    # responses" URL/RSS pattern 404s to the Swedish homepage (confirmed
    # 2026-09-27, 0 entries either way). This is a distinct content type
    # from all_material's English news/enforcement/publications feed, not
    # an overlapping translation of it (spot-checked: no title overlap
    # across the two feeds' current entries), so it is added as its own
    # source rather than skipped as the task's "full Swedish feed"
    # duplication risk describes for the general nyheter feed.
    preferred_language: sv
    labels:
      document_type: consultation

# ─── Non-EEA Additions ──────────────────────────────────────────────────────
# Deliberately outside this tool's core EEA/MiCA scope (see README "Coverage").
# The UK left the EU and runs its own separate crypto-asset regulatory regime,
# not MiCA - FCA is not an EEA/MiCA competent authority. Added anyway because
# it's directly relevant to CASP-adjacent regulatory monitoring for operators
# who deal with the UK market. Kept in its own section so the EEA coverage
# claim elsewhere in this repo stays accurate - don't fold entries here into
# the counts/claims above without updating those too.

