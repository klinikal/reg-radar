      volume_estimate:
        first_run: 10
        as_of: 2026-09-10
    - type: rss
      url: "https://www.occ.gov/rss/occ_bulletins.xml"
      label: bulletins
      preferred_language: en
      labels:
        document_type: final_guidance
      tags: [publications]
      backfill:
        supported: false
        method: none
        note: "OCC's RSS feeds are the only machine-readable route and occ.gov has no paged archive behind them - once an item ages off the feed it is gone"
