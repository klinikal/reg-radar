- id: us-treasury
  name: US Treasury
  full_name: United States Department of the Treasury
  jurisdiction: us
  jurisdiction_type: national
  website: https://home.treasury.gov
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: false
  notes: >-
    No RSS anywhere on home.treasury.gov. Deliberately NOT covered via the
    Federal Register treasury-department slug (#C1): that slug co-lists
    IRS/OFAC/TTB/Mint documents - 37 of 75 Treasury hits in a 30-day window
    were IRS. Selectors derived from the live page 2026-09-10, NOT from the
    issue's guesses: `.featured-stories__story` does not exist in the markup
    at all. The real listing is ten class-less <div> children of
    `.content--2col__body` inside `.featured-stories`, each holding a
    `<span class="date-format"><time datetime="...">` and an
    `<h3 class="featured-stories__headline"><a>`, hence
    date_attribute: datetime. Ten items per page; a pager follows. The
    listing container also carries data-news-manifest="/news-data/press-
    releases/manifest.json" with data-news-total="14848" - a possible
    json_api route to the full archive, not taken here (out of #M1's scope).
  sources:
    - type: scrape
      url: "https://home.treasury.gov/news/press-releases"
      label: press_releases
      preferred_language: en
      labels:
        document_type: press_release
      tags: [press_releases]
      scrape:
        item_selector: ".featured-stories .content--2col__body > div"
        title_selector: ".featured-stories__headline a"
        link_selector: ".featured-stories__headline a"
        date_selector: "time"
        date_attribute: "datetime"
        date_fuzzy: false
        content_selector: null
        extract_pdf_text: false

- id: us-finra
  name: FINRA
  full_name: Financial Industry Regulatory Authority
  jurisdiction: us
  jurisdiction_type: sro
  website: https://www.finra.org
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: false
  notes: >-
    DO NOT USE https://www.finra.org/rss.xml - it returns HTTP 200 with
    well-formed RSS and 10 items, but the newest entry is from JULY 2020. It
    is a dead Drupal default and would look permanently healthy while
    collecting nothing. Scrape is the only working route. FINRA is a private
    self-regulatory organisation, not a government agency, hence
    jurisdiction_type: sro (#P3) - its authority is delegated, and FINRA rule
    changes take effect only once filed with and approved by the SEC, which
    is why they surface in the Federal Register as SEC 'Self-Regulatory
    Organizations; ...' notices and are already covered by #C1. Both sources
    are Drupal views; selectors derived from the live pages 2026-09-10.
    IMPORTANT, disciplinary_actions URL correction: #M1 named
    /rules-guidance/oversight-enforcement/finra-disciplinary-actions-online.
    That page is 95KB of server-side HTML as the issue says, but it is a
    webform SEARCH FORM - zero <table>, zero .views-row, zero <time>. Any
    selector against it yields zero items, which #39 would record as
    `blocked` forever. The actual server-rendered disciplinary listing is
    /rules-guidance/oversight-enforcement/disciplinary-actions: a Drupal view
    of the monthly Disciplinary Actions Online reports, one <li> per month,
    each linking straight to a PDF. Cadence is MONTHLY, so item titles are
    bare month names ("August 2026") and the date comes from parsing that
    same anchor text - month and year are exact, the day-of-month is
    dateutil's fill-in from the collection date. extract_pdf_text is
    deliberately false: the adapter re-downloads every item's PDF on every
    run, and these monthly reports are large; the month/URL is the signal.
  sources:
    - type: scrape
      url: "https://www.finra.org/media-center/newsreleases"
      label: news_releases
      preferred_language: en
      labels:
        document_type: press_release
      tags: [press_releases]
      scrape:
        item_selector: ".view-news-releases .views-row"
        title_selector: ".views-field-title a"
        link_selector: ".views-field-title a"
        date_selector: "time"
        date_attribute: "datetime"
        date_fuzzy: false
        content_selector: ".views-field-body .field-content"
        extract_pdf_text: false
    - type: scrape
      url: "https://www.finra.org/rules-guidance/oversight-enforcement/disciplinary-actions"
      label: disciplinary_actions
      preferred_language: en
      labels:
        document_type: enforcement
      tags: [enforcement]
      scrape:
        item_selector: ".view-disciplinary-actions .item-list li"
        title_selector: ".views-field-title a"
        link_selector: ".views-field-title a"
        date_selector: ".views-field-title a"
        date_attribute: null
        date_fuzzy: false
        content_selector: null
        extract_pdf_text: false
      # Monthly cadence: the newest report is up to ~60 days old in the
      # worst case (e.g. an August report still newest in early October).
      # The 90-day default warn survives that; anything beyond it is a
      # genuinely missed month, which is what should be flagged.

- id: us-nmls
  name: NMLS
  full_name: Nationwide Multistate Licensing System (CSBS)
  jurisdiction: us
  jurisdiction_type: national
  website: https://mortgage.nationwidelicensingsystem.org
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: false
  notes: >-
    CSBS/NMLS is a state-regulator association, not a competent authority, so
    it sits under `us` rather than any single state - the State Licensing feed
    is a national aggregator of state licensing developments (TX-OCCC
    registration types, Massachusetts money-transmitter notices, Kansas virtual
    currency kiosk legislation), which is exactly what fifty per-state scrapers
    would be for. Anonymous SharePoint REST list; 50 items at capture, newest
    2026-08-24, oldest 2023-12-26. TWO adapter requirements, both verified live
    2026-09-10: (1) the Accept header below is mandatory - without it SharePoint
    serves Atom XML, and $format=json does NOT override it; (2) the list carries
    NO url field of any kind, so url_field is null and every item falls back to
    landing_url. That shared URL does not break dedup: storage.insert_item
    dedups on item.id and make_item_id hashes regulator_id|url|published_at, so
    distinct Created timestamps give distinct ids - asserted against the
    captured fixture in tests/test_nmls_shared_url_ids.py, not assumed. The cost
    is cosmetic: items link to the hub rather than the underlying notice. Body
    HTML is in NewsItemDescription; the rendered page is a JS-only SharePoint
    canvas, so scrape is useless here. Keep the NewsItemCategory filter -
    unfiltered, roughly 70% of the list is NMLS system-maintenance noise.
  sources:
    - type: json_api
      url: "https://mortgage.nationwidelicensingsystem.org/knowledge/news/_api/web/lists(guid'56c65850-d5ce-4ad3-8d14-66a6b1971afb')/items?$select=Title,NewsItemDescription,NewsItemCategory,Created&$filter=NewsItemCategory eq 'State Licensing'&$orderby=Created desc&$top=50"
      label: state_licensing
      preferred_language: en
      labels: {}
      tags: [publications]
      headers:
        Accept: "application/json;odata=nometadata"
      json_api:
        items_path: value
        title_field: Title
        url_field: null
        landing_url: "https://mortgage.nationwidelicensingsystem.org/knowledge/news/SitePages/Home.aspx"
        published_field: Created
      backfill:
        supported: false
        method: none
        note: "no paged backfill has been verified - the configured SharePoint call returns the newest 50 items ($top=50) and nothing behind them has been tested"
      volume_estimate:
        # 50 items at capture 2026-09-10, newest 2026-08-24, oldest 2023-12-26
        # (see `notes` above). per_week is left unknown rather than divided out
        # of a 20-month window that a category filter also narrows.
        first_run: 50
        as_of: 2026-09-10
