- id: us-federal-register
  name: Federal Register
  full_name: Office of the Federal Register (US)
  jurisdiction: us
  jurisdiction_type: national
  website: https://www.federalregister.gov
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: false
  notes: >-
    Single API call covering rulemaking and notices for seven federal agencies
    (SEC, CFTC, FinCEN, OCC, Federal Reserve, FDIC, CFPB) plus FINRA rule
    filings, which appear as SEC 'Self-Regulatory Organizations; ...' notices.
    KNOWN LIMITATION: every item from this source lands under the single
    us-federal-register regulator id. The per-item `agencies` field is fetched
    and present in the response, but no adapter splits one source across
    regulator ids, so an item's issuing agency is not attributed to an SEC/CFTC/
    FinCEN/OCC/Fed/FDIC/CFPB regulator entry. Working host is
    www.federalregister.gov/api/v1/ - api.federalregister.gov 302s to an unblock
    page. No API key required. Brackets in the query string MUST be
    percent-encoded (%5B%5D); literal [] returns an empty body. per_page is 200,
    not the API maximum of 1000: at the observed ~317 documents / 30 days that
    is roughly 19 days of newest-first backlog, ample for daily incremental
    polling, and it keeps the captured fixture under CONTRIBUTING.md's ~300KB
    sanity threshold (per_page=1000 returns ~758KB). `count` caps at 10000 and
    `total_pages` at 50; a historic backfill would need next_page_url's
    search_after_cursor. The treasury-department slug is deliberately excluded -
    it drags in IRS/OFAC/TTB/Mint co-listed documents (37 of 75 Treasury hits in
    a 30-day window were IRS); Treasury is covered by its own scrape source
    instead. The Federal Register carries NO enforcement, litigation,
    press-release, speech or testimony content of any kind - those need their own
    sources. regulations.gov is deliberately not used: it returns 403
    API_KEY_MISSING and needs an api.data.gov key while covering the same ground.
  sources:
    - type: json_api
      url: "https://www.federalregister.gov/api/v1/documents.json?order=newest&per_page=200&conditions%5Bagencies%5D%5B%5D=securities-and-exchange-commission&conditions%5Bagencies%5D%5B%5D=commodity-futures-trading-commission&conditions%5Bagencies%5D%5B%5D=financial-crimes-enforcement-network&conditions%5Bagencies%5D%5B%5D=comptroller-of-the-currency&conditions%5Bagencies%5D%5B%5D=federal-reserve-system&conditions%5Bagencies%5D%5B%5D=federal-deposit-insurance-corporation&conditions%5Bagencies%5D%5B%5D=consumer-financial-protection-bureau&fields%5B%5D=title&fields%5B%5D=html_url&fields%5B%5D=publication_date&fields%5B%5D=type&fields%5B%5D=agencies&fields%5B%5D=document_number"
      label: federal_register
      preferred_language: en
      labels: {}
      tags: [publications]
      json_api:
        items_path: results
        title_field: title
        url_field: html_url
        published_field: publication_date
      backfill:
        supported: true
        method: paged_api
        note: "the Federal Register API pages back through its full archive - `count` caps at 10000 and `total_pages` at 50, so a historic walk follows next_page_url's search_after_cursor rather than page numbers"
      volume_estimate:
        # ASSUMPTION: per_week is arithmetic on the ~317 documents / 30 days
        # observed live and recorded in `notes` above, not a separate count.
        # first_run is deliberately absent - the archive is deep but was never
        # counted, and "unknown" beats a guess.
        per_week: 74
        as_of: 2026-09-10

# KNOWN GAP - SEC litigation releases are not covered by this entry, and are
# not available anywhere else either: the Federal Register does not carry them
# (2 hits for "Litigation Release" since 2026-01-01 against hundreds of real
# ones), and the legacy /rss/litigation/*.xml feeds are retired and 404. A
# scrape is the only route and was attempted, not shipped: www.sec.gov's HTML
# path answers a 1,925-byte "Request Rate Threshold Exceeded" 403 from every
# network tried, including under a full browser UA, while its RSS answers 200
# in the same sequence. Selectors were never derived from a live page, and
# guessed ones would parse to zero items on a large body, which source health
# records as blocked forever. Needs egress SEC does not rate-limit; keep the
# 1 req/sec throttle and capture a fixture like any other source.
# See wiki/content/config-regulators.md.
- id: us-sec
  name: SEC
  full_name: Securities and Exchange Commission
  jurisdiction: us
  jurisdiction_type: national
  website: https://www.sec.gov
  mica_competent_authority: false
  enabled: true
  cloudflare_protected: false
  notes: >-
    sec.gov HTML and robots.txt 403 under the default reg-radar UA; the
    /news/*.rss feeds return 200 under both UAs, but a browser-shaped
    USER_AGENT (#P2) is required before the litigation-releases scrape in #M1
    works at all. SEC requires >=1 req/sec throttling - a burst of ~8 rapid
    requests triggered a site-wide penalty box lasting minutes; observed
    behaviour is stricter than the documented Fair Access policy at
    https://www.sec.gov/developer. statements.rss is a byte-level duplicate of
    speeches-statements.rss - do not add both. Rulemaking is NOT collected
    here: it comes via the Federal Register source (#C1), which also carries
    FINRA rule filings as SEC 'Self-Regulatory Organizations; ...' notices.
  sources:
    - type: rss
      url: "https://www.sec.gov/news/pressreleases.rss"
      label: press_releases
      preferred_language: en
      labels:
        document_type: press_release
      tags: [press_releases]
    - type: rss
      url: "https://www.sec.gov/news/speeches-statements.rss"
      label: speeches_statements
      preferred_language: en
      labels:
        document_type: speech
      tags: [speeches]
    - type: rss
      url: "https://www.sec.gov/news/testimony.rss"
      label: testimony
      preferred_language: en
      labels:
        document_type: speech
      tags: [speeches]
      # DISABLED, postponed. The feed itself works - 25 items with real dates,
      # verified live 2026-09-10 - but congressional testimony is episodic and
      # its newest item was already 210 days old at capture, past the 90-day
      # staleness warn. Rather than widen the threshold and lose the signal,
      # this stays off until someone wants US testimony specifically. Fixture
      # is kept at tests/fixtures/sources/us-sec/testimony.xml so re-enabling
      # is a one-line change.
      enabled: false

