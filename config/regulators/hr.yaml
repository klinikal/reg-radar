- id: hr-hanfa
  name: HANFA
  full_name: Croatian Financial Services Supervisory Agency
  jurisdiction: hr
  jurisdiction_type: member_state
  website: https://www.hanfa.hr/en/
  mica_competent_authority: true
  enabled: true
  cloudflare_protected: false
  warnings_url: https://www.hanfa.hr/consumers/warnings/
  notes: "English RSS lags Croatian feed slightly."
  # scripts/reprocess_bodies.py --refetch / collector detail-fetch (#17):
  # verified against 2 sampled live articles (834 and 5056 chars recovered).
  # Excludes are nav/breadcrumb/share chrome nested inside main.mainer.
  detail_selector: "main.mainer"
  detail_exclude: ["nav.navbar", ".mobilenav", ".breadcrumbs", ".grayrounder", ".sharelinks"]
  sources:
  - type: rss
    url: https://www.hanfa.hr/rss-en/
    label: all_news_en
    preferred_language: en
    labels: {}

