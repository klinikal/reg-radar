# eu/* selects EU-level output plus every member state (see
# wiki/content/concept-profiles-activities.md). regulators stays empty per the task-7 ruling; languages stays
# empty (all) since a pan-EU firm needs member-state-language output, not
# just English - unlike uk-equities-dealer, which watches a single
# English-language jurisdiction.
name: eu-casp
jurisdictions: [eu/*, intl]
activities: [casp]
instruments: []
exclude_instruments: []
document_types: []
regulators: []
languages: []
include_unclassified: true
