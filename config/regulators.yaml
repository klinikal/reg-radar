# EEA Regulator Feed Directory
# Generated: 2026-07-02
# Coverage: 3 EU supranational bodies + 30 member state / EEA regulators

# ─── EU Supranational ─────────────────────────────────────────────────────────

- id: esma
  name: ESMA
  full_name: European Securities and Markets Authority
  jurisdiction: EU
  jurisdiction_type: supranational
  website: https://www.esma.europa.eu
  mica_competent_authority: true
  enabled: true
  cloudflare_protected: false
  warnings_url: https://www.esma.europa.eu/investor-corner/frauds-and-scams
  notes: "Primary pan-EU CASP supervisor under MiCA. CASP register at registers.esma.europa.eu/publication/searchCASP."
  sources:
    - type: rss
      url: https://www.esma.europa.eu/rss.xml
      label: all_news
      preferred_language: en
      tags: [casp, mica, warnings]
    - type: scrape
      url: https://www.esma.europa.eu/databases-library/esma-library
      label: library
      preferred_language: en
      tags: [casp, mica, publications]
      notes: "Document library (guidelines, technical standards, Q&As, final reports, press releases). Default sort is newest-first, so scraping the base URL each run catches new publications. Historic backfill (~7,260 docs across ~363 pages) handled separately - see scripts/backfill_esma_library.py."
      scrape:
        item_selector: "table.views-table tbody tr"
        title_selector: "td.views-field-title a"
        link_selector: "td.views-field-title a"
        date_selector: "td.views-field-created time"
        date_attribute: "datetime"
        content_selector: "td.views-field-field-document-type"

- id: eba
  name: EBA
