# Deterministic, weighted, regex-capable classification rules (architecture
# doc §4.3), replacing the old alerts.yaml keyword tagger. Each entry scores
# an (axis, value) pair from config/taxonomy.yaml against an item's title
# and/or body; a match writes a `by: rule` classification row when the
# summed score reaches min_confidence below.
#
# Alias lists on taxonomy.yaml values are compiled into implicit rules at
# weight 0.7 automatically - most instruments need no entry here at all.
#
# Edit this file directly, or manage rules via the web UI at /rules.
#
min_confidence: 0.5
rules:
- axis: instrument
  value: mica
  match:
  - pattern: MiCA
    weight: 0.7
    flags: i
  fields:
  - title
  - body
- axis: instrument
  value: mifid2
  match:
  - pattern: MiFID
    weight: 0.7
    flags: i
  fields:
  - title
  - body
- axis: instrument
  value: transfer_of_funds_regulation
  match:
  - pattern: travel\ rule
    weight: 0.7
    flags: i
  fields:
  - title
  - body
- axis: document_type
  value: enforcement
  match:
  - pattern: enforcement\ action
    weight: 0.7
    flags: i
  - pattern: \bfine\b
    weight: 0.85
    flags: i
  - pattern: \bpenalty\b
    weight: 0.85
    flags: i
  - pattern: final notice
    weight: 0.85
    flags: i
  - pattern: decision notice
    weight: 0.85
    flags: i
  fields:
  - title
  title_multiplier: 1.0
- axis: document_type
  value: consultation
  match:
  - pattern: ^(CP|Consultation Paper)\s*\d
    weight: 0.95
  fields:
  - title
- axis: document_type
  value: final_guidance
  match:
  - pattern: Policy Statement
    weight: 0.85
    flags: i
  - pattern: \bPS\d+/\d+\b
    weight: 0.85
  - pattern: Final report
    weight: 0.85
    flags: i
  - pattern: Guidelines on
    weight: 0.85
    flags: i
  fields:
  - title
- axis: document_type
  value: technical_standard
  match:
  - pattern: \bRTS\b
    weight: 0.85
  - pattern: \bITS\b
    weight: 0.85
  - pattern: regulatory technical standard
    weight: 0.85
    flags: i
  - pattern: implementing technical standard
    weight: 0.85
    flags: i
  - pattern: delegated regulation
    weight: 0.85
    flags: i
  fields:
  - title
- axis: document_type
  value: warning
  match:
  - pattern: \bwarning\b
    weight: 0.85
    flags: i
  - pattern: \bunauthorised\b
    weight: 0.85
    flags: i
  - pattern: \bunauthorized\b
    weight: 0.85
    flags: i
  - pattern: \bscam\b
    weight: 0.85
    flags: i
  - pattern: clone firm
    weight: 0.85
    flags: i
  fields:
  - title
- axis: document_type
  value: speech
  match:
  - pattern: ^Speech
    weight: 0.85
  - pattern: \bkeynote\b
    weight: 0.85
    flags: i
  - pattern: remarks by
    weight: 0.85
    flags: i
  fields:
  - title
- axis: document_type
  value: press_release
  match:
  - pattern: ^Press release
    weight: 0.9
    flags: i
  fields:
  - title
