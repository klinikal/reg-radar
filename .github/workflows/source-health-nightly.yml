name: source-health-nightly

"on":
  schedule:
    # 03:00 UTC daily - well clear of the collector's own default 06:00 UTC run.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest
    # FlareSolverr so cloudflare_protected sources are checked live too,
    # not silently skipped - same image docker-compose.yml uses.
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir --require-hashes -r collector/requirements.lock

      # ie-cbi/enforcement_actions, ie-cbi/consultation_papers and
      # se-fi/investor_warnings are `type: browser` (Playwright) - without
      # this, fetch_raw() would fail on every run with "Executable doesn't
      # exist" for those three sources alone, same binary Dockerfile.collector
      # installs into the production image.
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run source health check
        env:
          REGULATORS_PATH: config/regulators
          FLARESOLVERR_URL: http://localhost:8191
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.source_health
